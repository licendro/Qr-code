<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colis">
<meta name="theme-color" content="#1c1a17">
<title>Scan colis</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#d9b98a,#2a2119);--card:light-dark(#fffdf8,#3a2e24);--ink:light-dark(#1c1a17,#f6eee2);
--mute:light-dark(#6d6155,#c3b39f);--line:light-dark(#e6dccd,#4e4033);--acc:#d7372b;--ok:#1f7a4a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:620px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(4vw,14px) 100px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font:800 32px/1.05 Archivo,sans-serif;margin:4px 0}
h2{font:800 20px Archivo,sans-serif;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.link{background:none;border:0;color:var(--mute);font:500 14px Inter;text-decoration:underline;cursor:pointer;min-height:44px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 10px 24px -14px rgba(0,0,0,.45)}
.scan{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:120px;border:0;border-radius:12px;background:var(--ink);color:var(--card);font:800 24px Archivo,sans-serif;cursor:pointer}
.scan svg{width:42px;height:42px}
.hint{font-size:13px;color:var(--mute);margin:8px 2px 0;text-align:center}
.res{margin-top:14px;border-radius:12px;padding:14px;display:none}
.res.ok{display:block;background:#e3f4ea;color:#0f4a2b}.res.warn{display:block;background:#fff1d6;color:#6b4500}.res.busy{display:block;background:var(--line)}
.res b{font:800 20px Archivo,sans-serif;display:block;margin-bottom:4px}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.code{font:600 14px ui-monospace,Menlo,monospace;background:rgba(0,0,0,.07);border-radius:6px;padding:3px 7px;overflow-wrap:anywhere}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--mute);border-top-color:var(--ink);border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(1turn)}}
.manual{display:flex;gap:8px;margin-top:12px}
input{font:16px Inter,sans-serif;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;min-height:46px}
.btn{min-height:46px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:600 16px Inter;padding:0 16px;cursor:pointer;flex:none}
.count{font:800 14px Archivo;background:var(--ink);color:var(--card);border-radius:999px;padding:2px 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li.it{background:var(--card);border-radius:12px;padding:10px 10px 10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.dt{font-size:13px;color:var(--mute)}
.del{grid-row:1/span 2;grid-column:2;min-width:44px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--mute);font-size:18px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:24px;background:var(--card);border-radius:12px}
.note{font-size:12.5px;color:var(--mute);margin-top:16px;text-align:center}
.alarm{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff;background:#c00;cursor:pointer}
.alarm.on{display:flex;animation:flash .25s steps(1) 8}
@keyframes flash{0%{background:#9a0000}50%{background:#ff2a2a}}
.alarm b{font:800 clamp(30px,9vw,52px)/1.05 Archivo,sans-serif}
.alarm p{margin:0;font-size:17px;max-width:32ch}
.login{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.login form{background:var(--card);padding:20px;border-radius:14px;width:100%;max-width:380px;display:grid;gap:10px}
.err{color:var(--acc);font-size:14px;min-height:20px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Scan colis</h1><button class="link" id="logout" type="button">Déconnexion</button></div>

  <section class="card">
    <button class="scan" id="scanBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
      Scanner un colis
    </button>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <p class="hint">Photo de l'étiquette entière, nette, codes-barres bien visibles.</p>
    <div class="res" id="res"></div>
    <form class="manual" id="mf" autocomplete="off"><input id="mnum" placeholder="Ou tape un numéro à la main" autocapitalize="characters"><button class="btn" type="submit">OK</button></form>
  </section>

  <h2>Colis scannés <span class="count" id="count">0</span></h2>
  <input id="q" type="search" placeholder="Chercher un numéro…" style="margin-bottom:10px">
  <ul id="list"></ul>
  <p class="note" id="store"></p>
  <p class="note"><button class="link" id="testAlarm" type="button">Tester l'alarme</button></p>
</div>

<div class="alarm" id="alarm" role="alert"><b>DÉJÀ SCANNÉ</b><p id="amsg"></p><small>Touche l'écran pour fermer</small></div>
<div class="login" id="login"><form id="lf"><h2 style="margin:0">Scan colis</h2><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button class="btn" type="submit">Entrer</button><div class="err" id="lerr"></div></form></div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numKey=n=>String(n||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^FR/,'');
const fmt=ts=>{const d=new Date(ts);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
let items=[],ver=0,lecture='locale';

async function api(path,opt={}){
  const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401&&path!=='/api/login'){showLogin();throw {status:401}}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw {status:r.status,...j};return j;
}

/* ---- sons ---- */
function wav(kind){const sr=22050,dur=kind==='ok'?.45:1.4,n=Math.floor(sr*dur),buf=new ArrayBuffer(44+n),v=new DataView(buf),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++){const t=i/sr;let s=128;if(kind==='ok'){const f=t<.15?1320:1760;if(t<.13||(t>.18&&t<.42))s=128+Math.round(90*Math.sin(2*Math.PI*f*t))}else{const f=Math.floor(t/.2)%2?520:1040;if((t%.2)<.17)s=Math.sin(2*Math.PI*f*t)>=0?250:6}v.setUint8(44+i,s)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}
const sA=new Audio(wav('alarm')),sO=new Audio(wav('ok'));const unl=new Set();
function unlock(){for(const a of [sA,sO]){if(unl.has(a))continue;try{a.muted=true;const p=a.play();const d=()=>{if(!a._b){a.pause();a.currentTime=0}a.muted=false;unl.add(a)};p&&p.then?p.then(d).catch(()=>{a.muted=false}):d()}catch(e){a.muted=false}}}
function play(a,ms){a._b=true;unl.add(a);setTimeout(()=>a._b=false,ms);try{a.muted=false;a.volume=1;a.currentTime=0;const p=a.play();p&&p.catch&&p.catch(()=>{})}catch(e){}}
function alarm(ex,code){
  $('amsg').textContent=`Le numéro ${code||ex.numero} a déjà été scanné le ${fmt(ex.ts)}.`;
  const a=$('alarm');a.classList.remove('on');void a.offsetWidth;a.classList.add('on');play(sA,1600);
  res('warn','Déjà scanné',`Scanné le ${fmt(ex.ts)}`,ex.codes||[ex.numero]);
}
$('alarm').onclick=()=>$('alarm').classList.remove('on');
$('testAlarm').onclick=()=>{unlock();alarm({numero:'FRTEST',ts:Date.now()},'FRTEST')};
function findDup(codes){const ks=new Set(codes.map(numKey).filter(Boolean));for(const it of items){const hit=(it.codes||[it.numero]).find(c=>ks.has(numKey(c)));if(hit)return {it,hit}}return null}

/* ---- affichage ---- */
function res(kind,title,txt,codes){const r=$('res');r.className='res '+kind;
  r.innerHTML=(kind==='busy'?'<span class="spin"></span>':'')+'<b></b><div class="t"></div>'+(codes&&codes.length?'<div class="codes">'+codes.map(c=>`<span class="code">${esc(c)}</span>`).join('')+'</div>':'');
  r.querySelector('b').textContent=title;r.querySelector('.t').textContent=txt||''}
function render(){
  const q=numKey($('q').value);
  const list=items.slice().sort((a,b)=>b.ts-a.ts).filter(i=>!q||(i.codes||[i.numero]).some(c=>numKey(c).includes(q)));
  $('count').textContent=items.length;
  $('list').innerHTML=list.length?list.slice(0,300).map(i=>`<li class="it"><div class="codes">${(i.codes||[i.numero]).map(c=>`<span class="code">${esc(c)}</span>`).join('')}</div><button class="del" data-id="${esc(i.id)}" type="button" aria-label="Supprimer">✕</button><div class="dt">${esc(fmt(i.ts))}</div></li>`).join('')
    :`<li class="empty">${q?'Aucun colis avec ce numéro.':'Aucun colis scanné.'}</li>`;
}
async function refresh(){try{const j=await api('/api/colis?v='+ver);if(!j.same){items=j.items;ver=j.version;render()}$('store').textContent='Liste partagée sur tous tes appareils'}catch(e){if(e.status!==401)$('store').textContent='Serveur injoignable, nouvel essai…'}}

/* ---- lecture des numéros ---- */
const loadScript=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
let zxP=null,tsP=null;
const loadZX=()=>zxP||(zxP=loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'));
const loadTS=()=>tsP||(tsP=loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'));
function loadImg(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=u})}
function canvasOf(im,max){const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c}
const cleanCode=c=>String(c||'').toUpperCase().replace(/^%|^\(\d\d\)/,'').replace(/[^A-Z0-9]/g,'');
const isPhone=c=>/^(33|0)[1-9]\d{8}$/.test(c);
const keep=c=>c.length>=8&&c.length<=40&&(c.match(/\d/g)||[]).length>=6&&!isPhone(c);

async function codesBarres(im){
  await loadZX();const Z=window.ZXing,found=new Set();
  const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);const rd=new Z.MultiFormatReader();rd.setHints(hints);
  for(const max of [1600,2400]){
    const c=canvasOf(im,max),W=c.width,H=c.height,d=c.getContext('2d').getImageData(0,0,W,H).data,L=new Uint8ClampedArray(W*H);
    for(let i=0,k=0;k<L.length;i+=4,k++)L[k]=(d[i]*.299+d[i+1]*.587+d[i+2]*.114);
    const regs=[[0,0,1,1]];for(const n of [2,3])for(let i=0;i<n;i++)for(let j=0;j<n;j++)regs.push([i/n,j/n,1/n+.15,1/n+.15]);
    for(const [rx,ry,rw,rh] of regs){
      const x=Math.floor(rx*W),y=Math.floor(ry*H),cw=Math.min(W-x,Math.floor(rw*W)),ch=Math.min(H-y,Math.floor(rh*H));
      const C=new Uint8ClampedArray(cw*ch);for(let j=0;j<ch;j++)C.set(L.subarray((y+j)*W+x,(y+j)*W+x+cw),j*cw);
      const R=new Uint8ClampedArray(cw*ch);for(let yy=0;yy<ch;yy++)for(let xx=0;xx<cw;xx++)R[xx*ch+(ch-1-yy)]=C[yy*cw+xx];
      for(const [B,w,h] of [[C,cw,ch],[R,ch,cw]]){const src=new Z.RGBLuminanceSource(B,w,h);
        for(const Bin of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){try{const r=rd.decode(new Z.BinaryBitmap(new Bin(src)));if(r)found.add(cleanCode(r.getText()));break}catch(e){}finally{rd.reset()}}}
    }
    if(found.size)break;
  }
  return [...found].filter(keep);
}
async function numerosTexte(im){
  await loadTS();const c=canvasOf(im,2200),g=c.getContext('2d'),d=g.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){let y=.299*p[i]+.587*p[i+1]+.114*p[i+2];y=Math.max(0,Math.min(255,(y-128)*1.5+128));p[i]=p[i+1]=p[i+2]=y}g.putImageData(d,0,0);
  const {data}=await Tesseract.recognize(c,'eng');
  const T=(data.text||'').toUpperCase(),out=new Set();
  for(const line of T.split(/\n/)){
    for(const tok of line.split(/[^A-Z0-9]+/))if(keep(tok))out.add(tok);           // FR3268170312, GL692682820JB
    const joined=line.replace(/(\w)\s(?=\w{3,4}\b)/g,'$1').replace(/[^A-Z0-9 ]/g,' '); // 0052 000G L692 → 0052000GL692
    for(const tok of joined.split(/\s+/))if(keep(tok))out.add(tok);
  }
  return [...out];
}
async function lireCodes(im){
  if(lecture==='claude'){
    try{const r=await api('/api/lire',{method:'POST',body:{image:canvasOf(im,1568).toDataURL('image/jpeg',.9)}});
      const bc=await codesBarres(im).catch(()=>[]);return [...new Set([...(r.codes||[]).map(cleanCode).filter(c=>c.length>=6),...bc])]}
    catch(e){if(e.status===401)throw e}
  }
  const [bc,tx]=await Promise.all([codesBarres(im).catch(()=>[]),numerosTexte(im).catch(()=>[])]);
  return [...new Set([...bc,...tx])];
}

async function enregistrer(codes){
  const d=findDup(codes);if(d)return alarm(d.it,d.hit);
  try{const j=await api('/api/colis',{method:'POST',body:{codes}});items.push(j.item);ver=j.version;render();play(sO,600);
    res('ok','✓ Nouveau colis enregistré',fmt(j.item.ts),j.item.codes)}
  catch(e){if(e.status===409&&e.existing)alarm(e.existing,e.code);else if(e.status!==401)res('warn','Échec','Enregistrement impossible, réessaie.')}
}
$('scanBtn').onclick=()=>{unlock();$('cam').click()};
$('cam').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  res('busy','Lecture des numéros…',lecture==='claude'?'':'10 à 20 secondes');
  let im;try{im=await loadImg(f)}catch(err){return res('warn','Photo illisible','Reprends la photo.')}
  let codes=[];try{codes=await lireCodes(im)}catch(err){if(err&&err.status===401)return}
  await refresh();
  if(!codes.length)return res('warn','Aucun numéro trouvé','Reprends la photo plus près, ou tape le numéro en dessous.');
  enregistrer(codes);
};
$('mf').onsubmit=e=>{e.preventDefault();unlock();const c=cleanCode($('mnum').value);if(c.length<4)return;$('mnum').value='';enregistrer([c])};
$('q').oninput=render;
$('list').onclick=async e=>{const b=e.target.closest('.del');if(!b)return;
  const row=b.closest('li');if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Suppr ?';b.style.color='var(--acc)';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='✕';b.style.color=''}},3000);return}
  try{const j=await api('/api/colis/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});items=items.filter(i=>i.id!==b.dataset.id);ver=j.version;render()}catch(err){}};

/* ---- connexion ---- */
function showLogin(){$('login').style.display='flex';setTimeout(()=>$('pw').focus(),50)}
$('lf').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';try{await api('/api/login',{method:'POST',body:{password:$('pw').value}});$('pw').value='';$('login').style.display='none';start()}catch(err){$('lerr').textContent=err.error||'Erreur'}};
$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch(e){}items=[];ver=0;render();showLogin()};
let poll=null;
async function start(){try{const me=await api('/api/me');lecture=me.lecture}catch(e){return}await refresh();clearInterval(poll);poll=setInterval(refresh,4000);loadZX().catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
render();start();
}
</script>
</body>
</html>
